name: DCO

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-off-history:
    name: Signed-off commit history
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify DCO trailers
        run: ./scripts/check-dco.sh --history HEAD
