name: rust
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.94.1: the toolchain every ProofKeel agent repo pins (rust-toolchain.toml,
        # bumped in lockstep with proofkeel-agent and proofkeel-sensor).
        # 1.85: this workspace's declared `rust-version` floor (workspace Cargo.toml),
        # kept deliberately below the pinned toolchain so proofkeel-agent's own MSRV
        # claim stays honest. `cargo +<toolchain>` below overrides the pinned
        # rust-toolchain.toml on every step so the 1.85 leg genuinely exercises MSRV
        # rather than silently re-running on 1.94.1.
        toolchain: ["1.94.1", "1.85"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-

      - name: cargo fmt --check
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check

      - name: cargo clippy
        run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo +${{ matrix.toolchain }} test --workspace
