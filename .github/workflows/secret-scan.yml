name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks reads .gitleaksignore from the tree it is scanning, and on a
      # pull request that tree is the one the change proposes — so a commit
      # can add a secret and suppress its own finding in the same breath, and
      # this job would pass it. Blocking the edit outright would mean two
      # pull requests for every new test fixture, and a gate that obstructs
      # ordinary work is a gate someone deletes. So this does not block: it
      # makes the suppression impossible to merge unnoticed, by naming every
      # added fingerprint as a warning annotation on the run itself rather
      # than leaving it as one more line in a diff.
      - name: Surface any newly suppressed findings
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          added="$(git diff "$BASE_SHA" -- .gitleaksignore \
            | grep '^+[0-9a-f]\{40\}:' || true)"
          if [ -n "$added" ]; then
            echo "$added" | while read -r line; do
              echo "::warning title=Secret finding suppressed::${line#+}"
            done
            echo "This pull request adds the above .gitleaksignore entries."
            echo "Each one silences a real gitleaks finding: confirm every"
            echo "entry is a test fixture and not a live credential."
          fi
      - name: Run gitleaks over full history
        run: |
          GITLEAKS_VERSION=8.21.2
          # Pinning the version pins a URL, not an artifact: a release asset
          # can be replaced under the same tag. This binary is the security
          # gate, so a swapped one does not merely run attacker code in CI —
          # it can exit 0 forever and the scan reports clean while leaking.
          # The digest is what makes the pin real, and it is the same
          # discipline packaging/install.sh already applies to our own
          # releases. Cross-checked against the upstream checksums file.
          GITLEAKS_SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact .
